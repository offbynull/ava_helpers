<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shaft" x1="0" x2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset=".2" stop-color="#cbd5e1"/>
      <stop offset=".48" stop-color="#f8fafc"/>
      <stop offset=".72" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- top journal -->
  <rect x="25" y="2" width="14" height="6" rx="2"
        fill="#64748b" stroke="#334155" stroke-width="1"/>
  <rect x="27" y="2.8" width="4" height="4.4" rx="1" fill="#e2e8f0" opacity=".8"/>

  <!-- bottom journal -->
  <rect x="25" y="56" width="14" height="6" rx="2"
        fill="#64748b" stroke="#334155" stroke-width="1"/>
  <rect x="27" y="56.8" width="4" height="4.3" rx="1" fill="#e2e8f0" opacity=".8"/>

  <!-- screw body -->
  <rect x="21.5" y="7" width="21" height="50" rx="4"
        fill="url(#shaft)" stroke="#334155" stroke-width="1.2"/>


  <!-- left shadow / right edge highlights -->
  <path d="M23.5 10V54" stroke="#0f172a" stroke-width="1" opacity=".35" stroke-linecap="round"/>
  <path d="M38.5 10V54" stroke="#fff" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>

  <!-- thread valleys -->
  <g fill="none" stroke="#334155" stroke-width="3.2"
     stroke-linecap="round" opacity=".9">
    <path d="M22 10 Q32 15 42 10"/>
    <path d="M22 17 Q32 22 42 17"/>
    <path d="M22 24 Q32 29 42 24"/>
    <path d="M22 31 Q32 36 42 31"/>
    <path d="M22 38 Q32 43 42 38"/>
    <path d="M22 45 Q32 50 42 45"/>
    <path d="M22 52 Q32 57 42 52"/>
  </g>

  <!-- bright thread faces -->
  <g fill="none" stroke="url(#thread)" stroke-width="2"
     stroke-linecap="round">
    <path d="M22 9 Q32 14 42 9"/>
    <path d="M22 16 Q32 21 42 16"/>
    <path d="M22 23 Q32 28 42 23"/>
    <path d="M22 30 Q32 35 42 30"/>
    <path d="M22 37 Q32 42 42 37"/>
    <path d="M22 44 Q32 49 42 44"/>
    <path d="M22 51 Q32 56 42 51"/>
  </g>

</svg>